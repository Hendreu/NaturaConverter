server {
    listen 80;
    server_name convert.natura.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name convert.natura.com;

    ssl_certificate /etc/letsencrypt/live/convert.natura.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/convert.natura.com/privkey.pem;

    # Hashed/static assets can be cached forever because their URL changes when content changes.
    location ~* ^/(assets|wasm|js|_build|__nitro)/ {
        proxy_pass http://app:6742;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # HTML and SSR responses must never be cached, otherwise stale index.html keeps loading old asset hashes.
    location / {
        proxy_pass http://app:6742;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
}
