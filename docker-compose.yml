# NaturaConverter — Docker Compose
# Red Hat / CLI-only usage: after `docker compose up`, run `docker compose logs app`
# to see the server IPs printed by the startup helper.

services:
  app:
    build: .
    expose:
      - "6742"
    environment:
      - PORT=6742
      - NITRO_HOST=0.0.0.0
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - app
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h; done'"
